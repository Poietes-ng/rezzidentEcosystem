# ──────────────────────────────────────────────────────────
# Dependabot — Automated dependency update PRs
#
# What this does:
#   Dependabot checks for outdated or vulnerable packages
#   and opens PRs to update them. You review and merge.
#
# Why it matters:
#   - Security patches land automatically
#   - You don't manually run "pnpm update" hoping nothing breaks
#   - Each update is an isolated PR with a changelog
#
# How to learn:
#   https://docs.github.com/en/code-security/dependabot
# ──────────────────────────────────────────────────────────
version: 2

updates:
  # ── Root monorepo (Turbo, TypeScript) ──
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "automated"
    commit-message:
      prefix: "chore(deps):"

  # ── Frontend (TanStack Start) ──
  - package-ecosystem: "npm"
    directory: "/apps/rezzident_FE"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "frontend"
    commit-message:
      prefix: "chore(fe-deps):"
    # Group TanStack packages together so they update as one PR
    groups:
      tanstack:
        patterns:
          - "@tanstack/*"
      tailwind:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"

  # ── Mobile (Expo / React Native) ──
  - package-ecosystem: "npm"
    directory: "/apps/rezzident_MB"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "mobile"
    commit-message:
      prefix: "chore(mb-deps):"
    # Group Expo packages together
    groups:
      expo:
        patterns:
          - "expo"
          - "expo-*"
      react-native:
        patterns:
          - "react-native"
          - "react-native-*"

  # ── Backend (Python / pip) ──
  - package-ecosystem: "pip"
    directory: "/apps/rezzident_BE"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "backend"
    commit-message:
      prefix: "chore(be-deps):"

  # ── GitHub Actions ──
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "chore(ci-deps):"
