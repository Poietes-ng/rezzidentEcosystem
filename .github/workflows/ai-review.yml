name: AI PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r ai-pr-reviewer/requirements.txt

      - name: Run AI review
        working-directory: ai-pr-reviewer
        run: python main.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Gemini keys (1–3) — tried in order on 429 rate-limit.
          # To add a 4th key: create GEMINI_API_KEY_4 in GitHub Secrets and
          # add it here — main.py will discover it automatically.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
