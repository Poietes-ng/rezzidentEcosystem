name: Frontend CI Pipeline

on:
  push:
    branches:
      - "feature/**"
      - "refactor/**"
      - "fix/**"
      - "chore/**"
      - "release/**"
      - "feat/**"
  pull_request:
    branches:
      - "dev"

jobs:
  frontend:
    name: CI (Lint, Test, & Build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22.x"
          cache: "pnpm"
          cache-dependency-path: "**/pnpm-lock.yaml"

      - name: install dependencies
        run: pnpm install --frozen-lockfile

      - name: lint
        run: pnpm turbo run lint --filter=rezzident-fe

      - name: test
        run: pnpm turbo run test --filter=rezzident-fe

      - name: build app
        run: pnpm turbo run build --filter=rezzident-fe
