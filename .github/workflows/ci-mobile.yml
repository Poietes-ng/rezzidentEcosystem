name: Mobile CI Pipeline

on:
  push:
    branches:
      - "feature/**"
      - "refactor/**"
      - "fix/**"
      - "chore/**"
      - "release/**"
      - "feat/**"
  pull_request:
    branches:
      - "dev"

jobs:
  mobile_ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.0

      - name: Setup Nodejs
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.x
          cache: pnpm
          cache-dependency-path: "**/pnpm-lock.yaml"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm turbo run check --filter=rezzident-mb

      - name: lint/format with eslint & prettier
        run: pnpm turbo run lint --filter=rezzident-mb

      - name: test with jest
        run: pnpm turbo run test --filter=rezzident-mb
