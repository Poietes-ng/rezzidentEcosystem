name: Mobile CI Pipeline

on:
  pull_request:
    branches:
      - "dev"
    paths:
      # ── Mobile app source ───────────────────────────────────────────────────
      # Catches all MB TypeScript/TSX, config, assets inside the MB app.
      - "apps/rezzident_MB/**"

      # ── Shared workspace packages ───────────────────────────────────────────
      # MB imports from all 4 packages (design-tokens, shared-types,
      # api-client, utils). A change in any package may break MB.
      - "packages/**"

      # ── Expo native project directories (bare workflow) ─────────────────────
      # android/ and ios/ contain native code generated by Expo.
      # Changes here (e.g. gradle, Podfile) can break the build.
      - "android/**"
      - "ios/**"

      # ── Root Expo config ────────────────────────────────────────────────────
      # app.json at repo root is the Expo configuration file.
      - "app.json"

      # ── Root workspace & build config ──────────────────────────────────────
      # pnpm-lock.yaml    — lockfile; frozen install fails on mismatch
      # package.json      — root scripts / overrides
      # pnpm-workspace.yaml — defines which packages exist in the graph
      # turbo.json        — pipeline config (check, lint, test tasks)
      # tsconfig.json     — base TypeScript config extended by MB
      - "pnpm-lock.yaml"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - "tsconfig.json"

      # ── This workflow file itself ───────────────────────────────────────────
      - ".github/workflows/ci-mobile.yml"

      # ── What intentionally does NOT trigger mobile CI ───────────────────────
      # docs/**, *.md, Makefile, docker-compose.yml, .env.example,
      # infrastructure/**, .github/ISSUE_TEMPLATE/**, PULL_REQUEST_TEMPLATE/**,
      # ai-pr-reviewer/**, apps/rezzident_BE/**, apps/rezzident_FE/**

jobs:
  mobile_ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.0

      - name: Setup Nodejs
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.x
          cache: pnpm
          cache-dependency-path: "**/pnpm-lock.yaml"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm turbo run check --filter=rezzident-mb

      - name: lint/format with eslint & prettier
        run: pnpm turbo run lint --filter=rezzident-mb

      - name: test with jest
        run: pnpm turbo run test --filter=rezzident-mb
