name: Backend CI Pipeline

on:
  push:
    branches:
      - "feat/**"
      - "fix/**"
      - "chore/**"
      - "refactor/**"
  pull_request:
    branches:
      - "dev"

jobs:
  Backend_lint:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Setup Pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Nodejs
        uses: actions/setup-node@v5
        with:
          node-version: "22.x"
          cache: "pnpm"
          cache-dependency-path: "**/pnpm-lock.yaml"

      - name: install dependencies
        run: pnpm install --frozen-lockfile

      - name: install backend dependencies
        working-directory: apps/rezzident_BE
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: lint/format with ruff & black
        working-directory: apps/rezzident_BE
        run: |
          ruff check .
          black --check .
          mypy api/ --ignore-missing-imports

  Backend_test:
    needs:
      - Backend_lint
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Setup Pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Nodejs
        uses: actions/setup-node@v5
        with:
          node-version: "22.x"
          cache: "pnpm"
          cache-dependency-path: "**/pnpm-lock.yaml"

      - name: install dependencies
        run: pnpm install --frozen-lockfile

      - name: install dependencies
        working-directory: apps/rezzident_BE
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Test with pytest
        working-directory: apps/rezzident_BE
        run: python -m pytest tests/ -v
