name: Backend CI Pipeline

on:
  pull_request:
    branches:
      - "dev"
    paths:
      # ── Backend source ──────────────────────────────────────────────────────
      # Catches all Python source, requirements.txt, alembic migrations, tests,
      # Dockerfile, and any other file inside the BE app directory.
      - "apps/rezzident_BE/**"

      # ── Node workspace (pnpm runs in CI before Python setup) ────────────────
      # The CI installs pnpm deps first. Lock file or root package.json changes
      # can break that step even if no Python file changed.
      - "pnpm-lock.yaml"
      - "package.json"

      # ── This workflow file itself ───────────────────────────────────────────
      # Always re-run if someone edits the CI config to validate the change.
      - ".github/workflows/ci-backend.yml"

      # ── What intentionally does NOT trigger backend CI ──────────────────────
      # docs/**, *.md, Makefile, docker-compose.yml, .env.example,
      # infrastructure/**, .github/ISSUE_TEMPLATE/**, PULL_REQUEST_TEMPLATE/**,
      # ai-pr-reviewer/**, apps/rezzident_FE/**, apps/rezzident_MB/**, packages/**

jobs:
  Backend_lint:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Setup Pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Nodejs
        uses: actions/setup-node@v5
        with:
          node-version: "22.x"
          cache: "pnpm"
          cache-dependency-path: "**/pnpm-lock.yaml"

      - name: install dependencies
        run: pnpm install --frozen-lockfile

      - name: install backend dependencies
        working-directory: apps/rezzident_BE
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: lint/format with ruff & black
        working-directory: apps/rezzident_BE
        run: |
          ruff check .
          black --check .

  Backend_test:
    needs:
      - Backend_lint
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: rezzident_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Setup Pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Nodejs
        uses: actions/setup-node@v5
        with:
          node-version: "22.x"
          cache: "pnpm"
          cache-dependency-path: "**/pnpm-lock.yaml"

      - name: install dependencies
        run: pnpm install --frozen-lockfile

      - name: install dependencies
        working-directory: apps/rezzident_BE
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Test with pytest
        working-directory: apps/rezzident_BE
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          DB_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          DB_HOST: "localhost"
          DB_PORT: "5432"
          DB_USER: "postgres"
          DB_NAME: "rezzident_test"
        run: python -m pytest tests/ -v
