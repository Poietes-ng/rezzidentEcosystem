services:
  # –– Rezzident Frontend service ––
  web:
    build:
      context: .
      dockerfile: apps/rezzident_FE/Dockerfile
      # VITE_ vars must be passed as build args — Vite bakes them into the
      # JS bundle at build time. Runtime env_file has no effect on them.
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://127.0.0.1:7001}
        VITE_CDN_URL: ${VITE_CDN_URL:-}
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - edge
    depends_on:
      - api
    restart: unless-stopped

  # –– Rezzident Backend service ––
  api:
    build:
      context: ./apps/rezzident_BE
    ports:
      - "127.0.0.1:7001:7001"
    env_file:
      - "./apps/rezzident_BE/.env"
    volumes:
      - "./apps/rezzident_BE:/apps/BE_code_store" # for local development(hot reload if source code changes or etc.), going to be taken off for production
    networks:
      - edge
      - private
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  # –– Rezzident Database service ––
  db:
    image: postgres:18-alpine
    container_name: rezzident_db
    environment:
      POSTGRES_USER: rezzident
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: rezzident
    volumes:
      - pgdata:/var/lib/postgresql
    networks:
      - private
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rezzident"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # –– Rezzident Database Migrations service ––
  migrate:
    build:
      context: ./apps/rezzident_BE
    env_file:
      - "./apps/rezzident_BE/.env"
    networks:
      - private
    depends_on:
      db:
        condition: service_healthy
    command: alembic upgrade head
    restart: "no"

  # –– Rezzident Database Seeds service ––
  seed:
    build:
      context: ./apps/rezzident_BE
    env_file:
      - "./apps/rezzident_BE/.env"
    networks:
      - private
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: python -m scripts.seeds.estate_structure_seeds
    restart: "no"

  # –– Rezzident Redis service ––
  redis:
    image: redis:8.8-alpine
    container_name: rezzident_redis
    volumes:
      - redis_data:/data
    networks:
      - private
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # –– Rezzident ARQ Worker service ––
  worker:
    build:
      context: ./apps/rezzident_BE
    env_file:
      - "./apps/rezzident_BE/.env"
    networks:
      - private
    depends_on:
      - db
      - redis
    restart: unless-stopped

  # –– Rezzident MinIO service ––
  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z # Dependabot will update this
    container_name: rezzident_minio
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      # Use the same values as MINIO_ACCESS_KEY / MINIO_SECRET_KEY in .env
      # so the Python Minio() client and the MinIO server share credentials.
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY:-minioadmin123}
    volumes:
      - minio_data:/data
    networks:
      - private
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

volumes:
  pgdata:
  minio_data:
  redis_data:

networks:
  edge:
    driver: "bridge"
  private:
    driver: "bridge"
    internal: "true"
