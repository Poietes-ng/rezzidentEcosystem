version: "3.9"

services:
  # ── PostgreSQL ──
  postgres:
    image: postgres:16-alpine
    container_name: rezzident_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: rezzident_dev_password
      POSTGRES_DB: rezzident_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ──
  redis:
    image: redis:7-alpine
    container_name: rezzident_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MinIO (Object Storage) ──
  minio:
    image: minio/minio:latest
    container_name: rezzident_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  # ── FastAPI Application ──
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rezzident_api
    restart: unless-stopped
    ports:
      - "7001:7001"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./media:/app/media
      - ./logs:/app/logs
    command: >
      gunicorn main:app
      --bind 0.0.0.0:7001
      --workers 4
      --worker-class uvicorn.workers.UvicornWorker
      --timeout 120
      --access-logfile -
      --error-logfile -

volumes:
  postgres_data:
  redis_data:
  minio_data:
